plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.liquidgallery'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.liquidgallery"
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
